spring:
  datasource:
    url: jdbc:mysql://localhost:3307/async_task_service_baseline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  data:
    redis:
      database: 1

app:
  task:
    execution-worker:
      enabled: true
      initial-delay-ms: 10000
      fixed-delay-ms: 10000
      batch-size: 5

    retry-scheduler:
      enabled: false
      initial-delay-ms: 30000
      fixed-delay-ms: 30000

    execution-async:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
      thread-name-prefix: baseline-task-execution-

    timeout-scheduler:
      enabled: false
      initial-delay-ms: 60000
      fixed-delay-ms: 60000
      timeout-seconds: 300

logging:
  level:
    root: WARN
    com.hongyun.asynctask: INFO
