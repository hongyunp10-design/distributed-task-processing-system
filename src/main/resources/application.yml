server:
  port: 8080

spring:
  application:
    name: async-task-service

  datasource:
    url: jdbc:mysql://localhost:3307/async_task_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hongyun.asynctask.model

app:
  task:
    retry-policy:
      default-max-retry-count: 3
      per-type:
        MEDIA: 2
        EMAIL: 5

    retry-scheduler:
      enabled: false
      fixed-delay-ms: 30000

    execution-worker:
      enabled: false
      fixed-delay-ms: 10000
      batch-size: 5

    execution-async:
      core-pool-size: 2
      max-pool-size: 4
      queue_capacity: 100
      thread_name-prefix: task-execution-

    timeout-scheduler:
      enabled: true
      fixed-delay-ms: 60000
      initial-delay-ms: 60000
      timeout-seconds: 300